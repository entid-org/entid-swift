# Generated code is never edited by hand and its shape is the emitter's
# responsibility, so it is linted through the emitter's own tests instead.
excluded:
  - .build
  - Examples/EntIDConsumer/.build
  - Sources/EntID/Generated
  - Sources/EntIDWire/Generated

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  # swift-format owns formatting and writes trailing commas in multi-line
  # literals; SwiftLint's opposite default would fight it on every save.
  - trailing_comma
  # The emitter and the load checks are long by nature: a switch over sixty
  # three opcodes is one statement per opcode, and splitting it would hide the
  # exhaustiveness the compiler checks.
  - cyclomatic_complexity
  - function_body_length
  - type_body_length

line_length:
  warning: 110
  error: 130
  ignores_comments: true

file_length:
  warning: 700
  error: 1000

identifier_name:
  min_length: 2
  # `a` through `h` are the working variables FIPS 180-4 names in the SHA-256
  # round function. Renaming them would make the implementation harder to check
  # against the standard it implements.
  excluded: [id, of, to, a, b, c, d, e, f, g, h]

force_cast: error
force_try: error
force_unwrapping: error
