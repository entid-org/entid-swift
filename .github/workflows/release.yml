name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Everything must be green before a tag means anything
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: The artefacts match rules.lock
        run: ./Tools/verify-lock.sh

      # Regenerating from the attested bundle must reproduce the committed code
      # exactly. If it does not, the tag would ship rules nobody reviewed.
      - name: Generated code is reproducible from the attested bundle
        run: |
          swift run businessid-gen
          git diff --exit-code -- Sources/BusinessID/Generated

      - name: Format, lint, build, test
        run: |
          swift format lint --recursive --strict --parallel Sources Tests Package.swift
          brew install swiftlint
          swiftlint lint --strict --quiet
          swift build
          swift build -c release
          swift test

      - name: The whole conformance corpus
        run: |
          swift build --product businessid-testee
          swift run businessid-conformance-runner --cases spec/businessid-conformance.binpb

      - name: Coverage gates
        run: ./Tools/coverage.sh

      - name: A consumer can resolve and use the package
        run: |
          cd Examples/BusinessIDConsumer
          swift build
          swift run BusinessIDConsumer

      # The tag is the version. A mismatch means the changelog and the package
      # disagree about what is being published.
      - name: The tag matches the declared engine version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DECLARED=$(grep -oE 'engineVersion = "[^"]+"' Sources/BusinessID/API/RulesInfo.swift \
            | sed -E 's/.*"(.*)"/\1/')
          echo "tag $TAG, declared $DECLARED"
          [ "$TAG" = "$DECLARED" ]
          grep -q "^## \[$DECLARED\]" CHANGELOG.md

  documentation:
    name: DocC archive
    runs-on: macos-15
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      # xcodebuild rather than the DocC plugin: the plugin is a package
      # dependency every consumer would then resolve, for an artefact only this
      # job produces.
      - name: Build
        run: |
          xcodebuild docbuild -scheme BusinessID \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/docc -quiet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: .build/docc/Build/Products/Debug/BusinessID.doccarchive
