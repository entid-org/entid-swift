name: Spec sync

# `engine.md` section 11.4: when `spec` publishes a release, the engine goes and
# fetches it; the release does not come and find the engine.
#
# A clock and a manual trigger, and deliberately not a `repository_dispatch`: an
# event pushed from `spec` would hand back with one hand the cross-repository
# write token this arrangement removes with the other. The latency of a daily
# clock is the price of that property, and the manual trigger exists for the day
# it costs too much.
on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to synchronize. Empty means the newest release.
        required: false
        type: string

permissions:
  contents: read

# One synchronization at a time, and never cancelled halfway: a run cancelled
# between the push and `gh pr create` leaves a branch behind and no pull request.
concurrency:
  group: spec-sync
  cancel-in-progress: false

jobs:
  compare:
    name: Compare the newest release to rules.lock
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compare.outputs.tag }}
      version: ${{ steps.compare.outputs.version }}
      sync: ${{ steps.compare.outputs.sync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Linux and no toolchain: comparing two strings has no reason to cost a
      # macOS runner every night, and on most nights that is the whole workflow.
      - name: Compare
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # Not `| tee -a "$GITHUB_OUTPUT"`. The default shell for a `run:` step
        # is `bash -e`, without pipefail, so a pipe would report the exit status
        # of `tee` and a failed comparison would look like an empty answer.
        run: |
          ./Tools/spec-sync.sh compare "${TAG:-}" > "$RUNNER_TEMP/compare.env"
          cat "$RUNNER_TEMP/compare.env"
          cat "$RUNNER_TEMP/compare.env" >> "$GITHUB_OUTPUT"

  sync:
    name: Synchronize ${{ needs.compare.outputs.version }}
    needs: compare
    if: needs.compare.outputs.sync == 'true'
    runs-on: macos-15
    permissions:
      # The engine writes in its own repository, with the token GitHub already
      # gives it. That is the second reason section 11.4 turns the direction
      # round: `spec` no longer needs a write token on four repositories, so a
      # compromise of `spec` stops at `spec`.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go twice over: the figures `write_provenance.sh` reads out of the
      # bundle, and the conformance runner `make verify` calls. `go-version:
      # stable` with `GOTOOLCHAIN: auto`, for the reason ci.yml gives: setup-go
      # pins GOTOOLCHAIN to local, and the binding condition is the `go` line of
      # the spec module, not its `toolchain` line.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Steps 1 to 3, and before the Swift toolchain rather than after it. The
      # sums, then the attestation, and only then anything on disk: a release
      # whose attestation does not verify never touches the working tree, and
      # never costs an Xcode selection and a SwiftLint install either.
      - name: Download the release and verify it before writing anything
        env:
          GH_TOKEN: ${{ github.token }}
          GOTOOLCHAIN: auto
          TAG: ${{ needs.compare.outputs.tag }}
          VERSION: ${{ needs.compare.outputs.version }}
        run: ./Tools/spec-sync.sh sync "$TAG" "$VERSION"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: SwiftLint
        run: brew install swiftlint

      # Step 4, and the reason this job cannot live in `spec`: regenerating
      # needs SwiftPM, which that repository does not have and will never have.
      # A release that pushed instead would ship the new bundle beside the old
      # emitted code, which is how the first release produced four red engines.
      #
      # Not allowed to stop the run either. A bundle the generator cannot
      # compile is the clearest possible case of a release bringing something
      # this engine cannot do yet, and section 11.4 turns that into a red pull
      # request rather than into no pull request at all.
      - name: Regenerate the emitted code
        id: generate
        continue-on-error: true
        run: make generate

      # Step 5. It is not allowed to stop the run: section 11.4 opens the pull
      # request green or red, and a red one is exactly the release that deserved
      # a human. It is never merged to unblock the chain.
      - name: The section 12.5 entry point
        id: verify
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        run: make verify

      # Step 6, and the auto-merge that makes a green synchronization need
      # nobody. The script refuses to enable it unless the section 12.5 entry
      # point is the one required check on main.
      - name: Open the pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.compare.outputs.tag }}
          VERSION: ${{ needs.compare.outputs.version }}
          OUTCOME: ${{ (steps.generate.outcome == 'success' && steps.verify.outcome == 'success') && 'success' || 'failure' }}
        run: ./Tools/spec-sync.sh pull-request "$TAG" "$VERSION" "$OUTCOME"

      # The pull request is open either way; this is what makes the run itself
      # red, so a failed synchronization is visible without opening it.
      - name: A red synchronization stays red
        if: steps.generate.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "::error::the synchronized tree does not verify" \
               "(generate ${{ steps.generate.outcome }}, verify ${{ steps.verify.outcome }})"
          exit 1
