name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `engine.md` section 12.6: one entry point, and CI calls the same one a
  # developer does, so "green" never has two definitions. It is silent when
  # everything passes and prints the failing step's output and only that when
  # something does not.
  verify:
    name: Verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      # The conformance runner comes from the specification repository, pinned
      # to the commit rules.lock records. `go-version: stable` and
      # `GOTOOLCHAIN: auto`: setup-go pins GOTOOLCHAIN to local, and the binding
      # condition is the `go` line of the spec module, not its `toolchain` line.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: SwiftLint
        run: brew install swiftlint
      - name: make verify
        env:
          GOTOOLCHAIN: auto
        run: make verify

  # A different toolchain, not a different subset: the floor the manifest
  # declares, named explicitly rather than inferred from an Xcode release.
  minimum-toolchain:
    name: macOS, minimum toolchain (Swift 6.1)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.1"
      - name: Build and test
        run: |
          swift --version
          swift build
          swift test

  # Outside `verify` on purpose: it needs protoc and a built protoc-gen-swift,
  # which the engine's own verification has no reason to require. It checks that
  # the committed Protobuf code still matches the schemas, so a difference here
  # is a schema change and not a tool version drift.
  protobuf:
    name: Protobuf code matches the schemas
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Regenerate and compare
        run: |
          brew install protobuf
          VERSION=$(python3 -c "import json; print(next(p['state']['version'] \
            for p in json.load(open('Package.resolved'))['pins'] \
            if p['identity'] == 'swift-protobuf'))")
          git clone --depth 1 --branch "$VERSION" \
            https://github.com/apple/swift-protobuf.git .swift-protobuf-tool
          swift build --package-path .swift-protobuf-tool -c release --product protoc-gen-swift
          PATH="$PWD/.swift-protobuf-tool/.build/release:$PATH" make proto
          git diff --exit-code -- Sources/EntIDWire/Generated
